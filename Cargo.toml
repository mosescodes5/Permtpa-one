[workspace]
resolver = "3"
members = ["services/api", "crates/domain"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "LicenseRef-Proprietary"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Argon2 is intentionally slow; optimise it even in debug builds so tests stay fast.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
