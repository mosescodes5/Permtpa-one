name: CI
on: { push: { branches: [main] }, pull_request: {} }
permissions: { contents: read }

env:
  PGHOST: 127.0.0.1
  PGPORT: "5432"
  PGPASSWORD: ci-superuser
  TEST_ADMIN_DATABASE_URL: postgres://postgres:ci-superuser@127.0.0.1:5432/postgres

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_PASSWORD: ci-superuser }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
      - run: pip install aiosmtpd
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Database-backed and SMTP tests
        # The SMTP sink must start in the SAME step as the tests: GitHub kills background
        # processes when the step that started them ends. Wait until its port accepts connections.
        run: |
          python3 scripts/smtp-sink.py 1025 /tmp/smtp-sink.log &
          for i in $(seq 1 50); do
            (echo > /dev/tcp/127.0.0.1/1025) 2>/dev/null && break
            sleep 0.2
          done
          cargo test -p permtpa-api --no-fail-fast -- --ignored --test-threads=4
        env: { TEST_SMTP_URL: "smtp://127.0.0.1:1025", TEST_SMTP_LOG: /tmp/smtp-sink.log }
      - run: bash ./scripts/test-db.sh
      - run: bash ./scripts/test-0009-upgrade.sh
      - run: cargo install cargo-audit cargo-deny --locked
      - run: cargo audit
      - run: cargo deny check

  e2e:
    runs-on: ubuntu-latest
    needs: [web, rust]
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_PASSWORD: ci-superuser }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: cargo build -p permtpa-api
      - run: bash ./scripts/e2e-setup.sh
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
