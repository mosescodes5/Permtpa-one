[advisories]
version = 2
ignore = [
  { id = "RUSTSEC-2026-0459", reason = "libsqlite3-sys appears in Cargo.lock only through sqlx's optional SQLite driver. This project uses PostgreSQL, and CI fails if the crate ever enters the build graph (see the cargo tree step in ci.yml)." },
]
[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0", "CDLA-Permissive-2.0", "0BSD", "BSL-1.0"]
[licenses.private]
# Our own crates are proprietary and unpublished (publish = false), so they need no SPDX license.
ignore = true
[bans]
multiple-versions = "warn"
